# OpsMap local infrastructure.
# Only Redis is containerized. Frontend and backend run on the host.
#
# Usage:
#   docker compose up -d
#   docker compose down

services:
  redis:
    image: redis:7-alpine
    container_name: opsmap-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
